events {}

http {
    upstream geodatamanager {
        server web:8070;
    }
    include /etc/nginx/mime.types;

    # Main app server
    server {
        listen 80;
        server_name e-safari.acmad.org;

        client_max_body_size 100M;

       location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }


        location /api/uploads/ {
            client_max_body_size 2G;

            # Optimize for large file uploads
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            proxy_pass http://geodatamanager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location /api/ {
            proxy_pass http://geodatamanager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location = /afri-met {
            return 301 /afri-met/;
        }

        location ^~ /afri-met/ {
            alias /usr/share/nginx/afri-met/;
            index index.html;
            try_files $uri $uri/ /afri-met/index.html;
        }

        location /titiler/ {
            proxy_pass http://titiler/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /titiler;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            proxy_redirect off;
            # Increase timeouts for large raster processing
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /tipg/ {
            proxy_pass http://tipg:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /stac/ {
            proxy_pass http://stac_api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            alias /static_files/;
        }

        location /media/ {
            alias /media_files/;
        }

        location / {
            proxy_pass http://geodatamanager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # we are taking down afrimet from this nginx maybe we will add it at a path 

    # server {
    #     listen 80;
    #     server_name afrimet.acmad.org;

    #     client_max_body_size 100M;

    #     location ^~ /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #         default_type "text/plain";
    #     }

    #     location / {
    #         root /usr/share/nginx/afri-met;
    #         index index.html;
    #         try_files $uri $uri/ /index.html;
    #     }
    # }

    # MinIO S3 API
    server {
        listen 80;
        server_name minio.acmad.org;

        client_max_body_size 0;
        proxy_buffering off;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    # MinIO Console
    server {
        listen 80;
        server_name console-minio.acmad.org;

        client_max_body_size 0;
        proxy_buffering off;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            proxy_pass http://minio:9001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
