events {}

http {
    upstream geodatamanager {
        server web:8000;
    }
     include /etc/nginx/mime.types;

    server {
        listen 80;

         client_max_body_size 100M;

          location /api/uploads/ {
            client_max_body_size 2G;

            # Optimize for large file uploads
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            proxy_pass http://geodatamanager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;

            proxy_set_header X-API-Key $http_x_api_key;
        }

        location /api/ {
            proxy_pass http://geodatamanager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;

            proxy_set_header X-API-Key $http_x_api_key;
        }

      
        location /titiler/ {
            proxy_pass http://titiler/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /titiler;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            proxy_redirect off;
        
            # Increase timeouts for large raster processing
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /tipg/ {
        proxy_pass http://tipg:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /stac/ {
            proxy_pass http://stac_api:8080/;  # note the trailing slash
            
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

        location /minio/ {
                proxy_pass http://minio:9000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
            }
        

        location /minio-console/ {
                proxy_pass http://minio:9001;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }


        location /static/ {
            alias /static_files/;
        }
        location /media/ {
            alias /media_files/;
        }


    }


}
