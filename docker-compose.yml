services:
  web:
    build: .
    container_name: geodatamanager_web
    env_file: .env
    command: /start
    volumes:
      - .:/app
      - static_volume:/static
      - media_volume:/app/media 
    depends_on:
      - db
      - redis
      - minio
  tipg:
    image: ghcr.io/developmentseed/tipg:1.0.1
    container_name: geodatamanager_tipg
    environment:
      # your main app PostGIS db
      DATABASE_URL: postgresql://geodatamanager:${POSTGRES_PASSWORD}@db:5432/geodatamanager
      TIPG_DB_SCHEMA: tiles
      TIPG_CATALOG_TTL: 100
      # POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASS: ${POSTGRES_PASSWORD}
      # POSTGRES_DBNAME: ${POSTGRES_DB}
      # POSTGRES_HOST: db
      # POSTGRES_PORT: 5432
      DB_MIN_CONN_SIZE: 1
      DB_MAX_CONN_SIZE: 10
      # optional but helpful
      TIPG_DEBUG: ${TIPG_DEBUG:-false}
      TIPG_CORS_ORIGINS: "http://localhost,http://localhost:3000"
    ports:
      - "8082:8080"
    command:
      bash -c "bash /tmp/scripts/wait-for-it.sh -t 120 -h db -p 5432 && uvicorn tipg.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      - db
    volumes:
      - ./dockerfiles/scripts:/tmp/scripts

  
  worker:
    build: .
    container_name: geodatamanager_worker
    env_file: .env
    command: celery -A geodatamanager worker -l info
    volumes:
      - .:/app
      - static_volume:/static
      - media_volume:/app/media
    depends_on:
      - db
      - redis
      - minio

  redis:
    image: redis:7-alpine
    container_name: geodatamanager_redis
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    container_name: geodatamanager_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:1.25-alpine
    container_name: geodatamanager_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
    depends_on:
      - web

  db:
    image: kartoza/postgis:18-3.6
    container_name: geodatamanager_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.9.9
    container_name: geodatamanager_pgstac
    environment:
      POSTGRES_DB: pgstac
      POSTGRES_USER: ${PG_STAC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PG_STAC_POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgstac_data:/var/lib/postgresql/data
  pgstac_migrate:
    image: python:3.12-slim
    depends_on:
      - pgstac
    environment:
      PGHOST: pgstac
      PGPORT: ${PG_STAC_POSTGRES_PORT}
      PGDATABASE: ${PG_STAC_POSTGRES_DB}
      PGUSER: ${PG_STAC_POSTGRES_USER}
      PGPASSWORD: ${PG_STAC_POSTGRES_PASSWORD}
    entrypoint: /bin/bash
    command: >
      -lc "pip install --no-cache-dir 'pypgstac[psycopg]' &&
         pypgstac migrate --dsn postgresql://${PG_STAC_POSTGRES_USER}:${PG_STAC_POSTGRES_PASSWORD}@pgstac:5432/${PG_STAC_POSTGRES_DB}"

  stac_api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    container_name: geodatamanager_stac_api
    depends_on:
      - pgstac
    environment:
      pguser: ${PG_STAC_POSTGRES_USER}
      pgpassword: ${PG_STAC_POSTGRES_PASSWORD}
      pgdatabase: pgstac
      pghost: pgstac
      POSTGRES_HOST_READER: pgstac
      POSTGRES_HOST_WRITER: pgstac
      pgport: 5432
      ENABLE_TRANSACTIONS_EXTENSIONS: "true"
      ENABLED_EXTENSIONS: "transactions,bulk_transactions"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      # Tell it where it is hosted (optional but useful for links)
      STAC_FASTAPI_API_ROOT: http://nginx/stac
      CORS_ORIGINS: "http://localhost,http://localhost:3000"
      CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_HEADERS: "*"
    command: python -m stac_fastapi.pgstac.app
      
    ports:
      - "8081:8080"


volumes:
  pgdata:
  static_volume:
  minio_data:
  pgstac_data:
  media_volume: 
