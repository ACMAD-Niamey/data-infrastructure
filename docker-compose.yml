services:
  web:
    build: .
    container_name: geodatamanager_web
    env_file: .env
    command: /start
    volumes:
      - .:/app
      - static_volume:/static
    depends_on:
      - db
      - redis
      - minio
  
  worker:
    build: .
    container_name: geodatamanager_worker
    env_file: .env
    command: celery -A geodatamanager worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - minio

  redis:
    image: redis:7-alpine
    container_name: geodatamanager_redis
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    container_name: geodatamanager_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:1.25-alpine
    container_name: geodatamanager_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
    depends_on:
      - web

  db:
    image: postgres:16
    container_name: geodatamanager_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgstac:
    image: ghcr.io/stac-utils/pgstac:latest
    container_name: geodatamanager_pgstac
    environment:
      POSTGRES_DB: pgstac
      POSTGRES_USER: ${PG_STAC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PG_STAC_POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgstac_data:/var/lib/postgresql/data
  
  stac_api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    container_name: geodatamanager_stac_api
    depends_on:
      - pgstac
    environment:
      POSTGRES_USER: ${PG_STAC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PG_STAC_POSTGRES_PASSWORD}
      POSTGRES_DB: pgstac
      POSTGRES_HOST_READER: pgstac
      POSTGRES_HOST_WRITER: pgstac
      # Tell it where it is hosted (optional but useful for links)
      STAC_FASTAPI_API_ROOT: http://nginx/stac
    ports:
      - "8081:8080"


volumes:
  pgdata:
  static_volume:
  minio_data:
  pgstac_data:
