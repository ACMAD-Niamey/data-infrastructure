services:
  web:
    build: .
    container_name: geodatamanager_web
    env_file: .env
    command: /start
    volumes:
      - .:/app
      - ${STATIC_VOLUME}:/home/app/web/static
      - ${MEDIA_VOLUME}:/app/media
    ports:
      - "8070"
    depends_on:
      - db
      - redis
      - minio
      - nginx
    restart: on-failure
    networks:
      - data_infra_network

  tipg:
    image: ghcr.io/developmentseed/tipg:1.0.1
    container_name: geodatamanager_tipg
    environment:
      # your main app PostGIS db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/geodatamanager
      TIPG_DB_SCHEMA: tiles
      TIPG_CATALOG_TTL: 100
      DB_MIN_CONN_SIZE: 1
      DB_MAX_CONN_SIZE: 10
      # optional but helpful
      TIPG_DEBUG: ${TIPG_DEBUG:-false}
      TIPG_ONLY_SPATIAL_TABLES: "true"
      TIPG_CORS_ORIGINS: "http://localhost,http://localhost:3000, https://e-safari.acmad.org, ${TIPG_CORS_ORIGINS:-https://afrimet.acmad.org}"
    ports:
      - "8082:8080"
    command:
      bash -c "bash /tmp/scripts/wait-for-it.sh -t 120 -h db -p 5432 && uvicorn tipg.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      - db
    volumes:
      - ./dockerfiles/scripts:/tmp/scripts
    networks:
      - data_infra_network

  
  worker:
    build: .
    container_name: geodatamanager_worker
    env_file: .env
    command: celery -A geodatamanager worker -l info
    volumes:
      - .:/app
      - ${STATIC_VOLUME}:/home/app/web/static
      - ${MEDIA_VOLUME}:/app/media
      - ${WIS2_DOWNLOAD_MOUNT_VOLUME:-/mnt/blockstorage/wis2_downloads}:/app/blockstorage/wis2_downloads
    depends_on:
      - db
      - redis
      - minio
    networks:
      - data_infra_network
  
  celery-beat:
    container_name: geodatamanager_celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env
    restart: "unless-stopped"
    depends_on:
      - redis
    networks:
      - data_infra_network
    command: celery -A geodatamanager beat -l info

  wis2_consumer:
    build: .
    container_name: geodatamanager_wis2_consumer
    env_file: .env
    command: python manage.py run_wis2_consumer
    volumes:
      - .:/app
      - ${WIS2_DOWNLOAD_MOUNT_VOLUME:-/mnt/blockstorage/wis2_downloads}:/app/blockstorage/wis2_downloads
    depends_on:
      - db
      - redis
    restart: on-failure
    stop_grace_period: 10s
    networks:
      - data_infra_network

  redis:
    image: redis:7-alpine
    container_name: geodatamanager_redis
    ports:
      - "6379:6379"
    networks:
      - data_infra_network
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: geodatamanager_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_LOGIN_ANIMATION: "off"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINIO_VOLUME}:/data
    networks:
      - data_infra_network

  nginx:
    # image: nginx:1.25-alpine
    container_name: geodatamanager_nginx
    build : 
      context: .
      dockerfile: nginx/Dockerfile
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${NGINX_CONFIG}:/etc/nginx/nginx.conf:ro
      - ${STATIC_VOLUME}:/static_files
      - ${MEDIA_VOLUME}:/media_files
      - ${LETSENCRYPT_VOLUME:-./nginx/letsencrypt}:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
      # - ${UI_DIR}:/usr/share/nginx/html
    networks:
      - data_infra_network
    restart: on-failure
  certbot:
    image: certbot/certbot
    container_name: geodatamanager_certbot
    volumes:
      - ${LETSENCRYPT_VOLUME:-./nginx/letsencrypt}:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    entrypoint: ""
    command: certbot certonly --webroot --webroot-path=/var/www/certbot --email ${EMAIL} --agree-tos --no-eff-email -d ${DOMAIN} -d ${DOMAIN_MINIO_CONSOLE} -d ${DOMAIN_MINIO} -d ${DOMAIN_AFRIMET:-afrimet.acmad.org} -d ${DOMAIN_MULTI_HAZARD:-multi-hazard.acmad.org}
   
  certbot-renew:
    image: certbot/certbot
    container_name: geodatamanager_certbot_renew
    volumes:
      - ${LETSENCRYPT_VOLUME:-./nginx/letsencrypt}:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    entrypoint: ""
    command: >
      sh -c "while :; do certbot renew --webroot --webroot-path=/var/www/certbot && echo 'Renewal complete'; sleep 24h; done"

  db:
    # image: kartoza/postgis:18-3.6
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    container_name: geodatamanager_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${PGDATA_VOLUME}:/var/lib/postgresql
      - ./docker/db/initdb:/docker-entrypoint-initdb.d
    networks:
      - data_infra_network

  pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.9.9
    container_name: geodatamanager_pgstac
    environment:
      POSTGRES_DB: pgstac
      POSTGRES_USER: ${PG_STAC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PG_STAC_POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgstac_data:/var/lib/postgresql/data

    networks:
      - data_infra_network
  pgstac_migrate:
    image: python:3.12-slim
    depends_on:
      - pgstac
    environment:
      PGHOST: pgstac
      PGPORT: ${PG_STAC_POSTGRES_PORT}
      PGDATABASE: ${PG_STAC_POSTGRES_DB}
      PGUSER: ${PG_STAC_POSTGRES_USER}
      PGPASSWORD: ${PG_STAC_POSTGRES_PASSWORD}
    entrypoint: /bin/bash
    command: >
      -lc "pip install --no-cache-dir 'pypgstac[psycopg]' &&
         pypgstac migrate --dsn postgresql://${PG_STAC_POSTGRES_USER}:${PG_STAC_POSTGRES_PASSWORD}@pgstac:5432/${PG_STAC_POSTGRES_DB}"
    networks:
      - data_infra_network

  stac_api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    container_name: geodatamanager_stac_api
    depends_on:
      - pgstac
    environment:
      pguser: ${PG_STAC_POSTGRES_USER}
      pgpassword: ${PG_STAC_POSTGRES_PASSWORD}
      pgdatabase: pgstac
      pghost: pgstac
      POSTGRES_HOST_READER: pgstac
      POSTGRES_HOST_WRITER: pgstac
      pgport: 5432
      ENABLE_TRANSACTIONS_EXTENSIONS: "true"
      ENABLED_EXTENSIONS: "transactions,bulk_transactions"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      # Tell it where it is hosted (optional but useful for links)
      STAC_FASTAPI_API_ROOT: http://nginx/stac
      CORS_ORIGINS: "http://localhost,http://localhost:3000"
      CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_HEADERS: "*"
    command: python -m stac_fastapi.pgstac.app
      
    ports:
      - "8081:8080"
    networks:
      - data_infra_network

  titiler:
    container_name: geodatamanager_titiler
    image: ghcr.io/developmentseed/titiler:latest
    platform: linux/amd64
    ports:
      - "8000:80"
    environment:
      - TITILER_API_DISABLE_CORS=False
      # - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      # - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      # - AWS_S3_ENDPOINT=${MINIO_ENDPOINT}
      # - AWS_S3_SECURE=false
      # - AWS_S3_REGION_NAME=us-east-1
      # - AWS_HTTPS="false"
    depends_on:
      - minio

    volumes:
      - ${PORTAL_RASTERS_VOLUME}:/data
    restart: on-failure
    networks:
      - data_infra_network


volumes:
  # pgdata:
  #   name: ${PGDATA_VOLUME:-geomgr_pgdata}
  static_volume:
  pgstac_data:
  media_volume:

networks:
  data_infra_network:
    driver: bridge  
