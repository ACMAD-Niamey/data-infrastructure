services:
  web:
    build: .
    container_name: geodatamanager_web
    env_file: .env
    command: /start
    volumes:
      - .:/app
      - static_volume:/static
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    container_name: geodatamanager_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
    depends_on:
      - web

  db:
    image: postgres:16
    container_name: geodatamanager_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  static_volume:
